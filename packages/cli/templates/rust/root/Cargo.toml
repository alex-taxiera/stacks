# The Rust workspace: the core crate and every Tauri app's src-tauri.
[workspace]
resolver = "3"
members = ["crates/*", "apps/*/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"

# One version of each shared crate for every member; a member asks with `serde.workspace = true`.
[workspace.dependencies]
app-core = { path = "crates/core" }
serde = { version = "__CRATE[serde]__", features = ["derive"] }
serde_json = "__CRATE[serde_json]__"
ts-rs = "__CRATE[ts-rs]__"

[profile.release]
codegen-units = 1
lto = true
strip = true
