[package]
name = "__APP_NAME__"
description = "__APP_TITLE__"
version.workspace = true
edition.workspace = true
publish = false

[lib]
# `_lib`, so it doesn't collide with the binary on Windows (cargo#8519).
name = "__APP_LIB__"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "__CRATE[tauri-build]__", features = [] }

[dependencies]
app-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "__CRATE[tauri]__", features = [] }
tauri-plugin-dialog = "__CRATE[tauri-plugin-dialog]__"
tauri-plugin-opener = "__CRATE[tauri-plugin-opener]__"
# stacks:slot dependencies
