# Makes a release of __APP_NAME__ live for installed copies: when you publish one of its drafts
# (`__APP_NAME__@v1.2.3`), this copies that release's latest.json to the `__APP_NAME__-updater`
# release, which is where the app looks for updates. Each app has its own, so a repo's other
# releases never reach it, and nothing reaches it until you publish.
name: Updater __APP_NAME__

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    name: Point the updater at ${{ github.event.release.tag_name }}
    if: startsWith(github.event.release.tag_name, '__APP_NAME__@v')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event.release.tag_name }}
      UPDATER: __APP_NAME__-updater
    steps:
      - run: gh release download "$TAG" --pattern latest.json --dir "$RUNNER_TEMP"
      - name: Make the updater's release, the first time
        run: |
          gh release view "$UPDATER" > /dev/null 2>&1 ||
            gh release create "$UPDATER" --prerelease --latest=false \
              --title "__APP_TITLE__ updates" \
              --notes "Where installed copies of __APP_TITLE__ look for updates. Not a release to download."
      - run: gh release upload "$UPDATER" "$RUNNER_TEMP/latest.json" --clobber
