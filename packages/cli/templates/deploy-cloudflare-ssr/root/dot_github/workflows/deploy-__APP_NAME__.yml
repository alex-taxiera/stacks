# Builds apps/__APP_NAME__, applies its migrations and deploys it to Cloudflare Workers when it,
# the shared UI package or the lockfile changes on trunk, or by hand.
#
# Needs three repository secrets:
#   CLOUDFLARE_API_TOKEN   a token with the account's "Workers Scripts: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID
#   DATABASE_URL           the database's own connection string (not Hyperdrive's), for migrations
# and, once, the Worker's own secret: `pnpm exec wrangler secret put BETTER_AUTH_SECRET`.
name: Deploy __APP_NAME__

on:
  push:
    branches: [trunk]
    paths:
      - apps/__APP_NAME__/**
      - packages/ui/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/deploy-__APP_NAME__.yml
  workflow_dispatch:

# One deploy at a time, and never cancelled halfway through its migrations.
concurrency:
  group: deploy-__APP_NAME__
  cancel-in-progress: false

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  deploy:
    name: Build, migrate and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@__ACTION[actions/checkout]__
      - uses: pnpm/action-setup@__ACTION[pnpm/action-setup]__
      - uses: actions/setup-node@__ACTION[actions/setup-node]__
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter __APP_NAME__ build
      # Before the new release, while the old one keeps serving: every migration must work with
      # the old release's code.
      - name: Migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --filter __APP_NAME__ db:migrate
      - name: Deploy
        working-directory: apps/__APP_NAME__
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
