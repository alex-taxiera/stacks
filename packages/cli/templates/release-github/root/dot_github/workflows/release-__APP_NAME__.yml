# Builds apps/__APP_NAME__'s installers for Windows, macOS and Linux when a version tag
# (`__APP_NAME__@v1.2.3`) is pushed, or when run by hand for one platform or all, and attaches them
# to a draft release named for the version in tauri.conf.json. Publishing the draft is up to you;
# when that makes the tag, there's nothing left to build.
name: Release __APP_NAME__

on:
  push:
    tags: ["__APP_NAME__@v*"]
  workflow_dispatch:
    inputs:
      platform:
        description: Which installers to build
        type: choice
        options: [all, windows, macos, linux]
        default: all

permissions:
  contents: write

env:
  HUSKY: 0

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      published: ${{ steps.published.outputs.published }}
    steps:
      # Publishing a draft made by hand creates its tag, which is a tag push; that release is done.
      - id: published
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          echo "published=$([ "$draft" = false ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - id: pick
        env:
          # A tag push builds everything.
          WANT: ${{ inputs.platform || 'all' }}
        run: |
          all='[
            {"platform": "windows", "name": "Windows", "os": "windows-latest", "args": ""},
            {"platform": "macos", "name": "macOS", "os": "macos-latest", "args": "--target universal-apple-darwin"},
            {"platform": "linux", "name": "Linux", "os": "ubuntu-latest", "args": ""}
          ]'
          echo "matrix=$(jq -c --arg want "$WANT" '[.[] | select($want == "all" or .platform == $want)]' <<< "$all")" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: plan
    if: needs.plan.outputs.published != 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@__ACTION[actions/checkout]__

      # Ubuntu's mirrors are sometimes out of reach from a runner: retry, and give up in minutes
      # rather than waiting out the job.
      - name: Install the libraries Tauri builds against
        if: matrix.platform == 'linux'
        timeout-minutes: 10
        run: |
          echo 'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/80-retries
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # A toolchain channel, not a version: the action's branches are named for them.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@__ACTION[Swatinem/rust-cache]__

      - uses: pnpm/action-setup@__ACTION[pnpm/action-setup]__

      - uses: actions/setup-node@__ACTION[actions/setup-node]__
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@__ACTION[tauri-apps/tauri-action]__
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # stacks:slot tauri-action-env
        with:
          projectPath: apps/__APP_NAME__
          tauriScript: pnpm tauri
          # tauri-action fills __VERSION__ in from tauri.conf.json, so a run by hand makes the same
          # release as the version's tag would.
          tagName: __APP_NAME__@v__VERSION__
          releaseName: __APP_TITLE__ v__VERSION__
          releaseBody: See the assets below to download and install this version.
          releaseDraft: true
          prerelease: false
          # Merged over tauri.conf.json for these builds only (src-tauri/tauri.release.conf.json).
          args: --config src-tauri/tauri.release.conf.json ${{ matrix.args }}
          # stacks:slot tauri-action-with
