# pgBackRest's settings for __APP_NAME__. compose.prod.yaml sets the S3 repository's bucket, keys,
# region and endpoint with PGBACKREST_REPO1_* variables, which also override anything here.

[global]
repo1-type=s3
repo1-path=/__APP_NAME__
# Four full backups, and the WAL and differential backups that go with them.
repo1-retention-full=4
compress-type=zst
# Start a backup with an immediate checkpoint, and copy only the files that changed.
start-fast=y
delta=y
# The container's logs are the log.
log-level-console=info
log-level-file=off

[main]
pg1-socket-path=/var/run/postgresql
