name: CI

on:
  push:
    branches: [trunk]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Git hooks are for local commits only.
  HUSKY: 0

jobs:
  check:
    name: Lint, format and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@__ACTION[actions/checkout]__
      - uses: pnpm/action-setup@__ACTION[pnpm/action-setup]__
      - uses: actions/setup-node@__ACTION[actions/setup-node]__
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint --format github
      - run: pnpm format:check
      - run: pnpm typecheck
      # Packages that ship agent skills check them against their source (Intent).
      - run: pnpm -r --if-present run skills:check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@__ACTION[actions/checkout]__
      - uses: pnpm/action-setup@__ACTION[pnpm/action-setup]__
      - uses: actions/setup-node@__ACTION[actions/setup-node]__
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Browsers for packages with browser tests (Storybook stories run in headless Chromium).
      - run: pnpm -r --if-present run test:setup --with-deps
      - run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@__ACTION[actions/checkout]__
      - uses: pnpm/action-setup@__ACTION[pnpm/action-setup]__
      - uses: actions/setup-node@__ACTION[actions/setup-node]__
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
