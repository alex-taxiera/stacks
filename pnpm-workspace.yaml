packages:
  - apps/*
  - packages/*
minimumReleaseAge: 4320
allowBuilds:
  esbuild: true
catalog:
  # One version of each shared dependency for every package. A package asks for one with
  # "react": "catalog:". stacks fills these from its known-good snapshot;
  # its own runtime dependencies are added by hand.
  "@clack/prompts": ^1.9.0
  "@tanstack/intent": ^0.5.6
  "@types/node": ^24.19.2
  "@types/semver": ^7.8.0
  husky: ^9.1.7
  lint-staged: ^17.6.0
  oxfmt: ^0.78.0
  oxlint: ^1.93.0
  semver: ^7.8.6
  typescript: ^7.0.2
  vitest: ^5.1.0
  yaml: ^2.9.1
